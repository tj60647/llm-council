       the larger seat is the chairman. -->
  <circle cx="512" cy="512" r="512" fill="#17181c"/>
  <!-- table -->
  <circle cx="512" cy="512" r="310" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="14"/>
  <!-- seats -->
  <circle cx="512" cy="202" r="104" fill="#ffffff"/>
  <circle cx="780" cy="357" r="70" fill="#ffffff"/>
  <circle cx="780" cy="667" r="70" fill="#ffffff"/>
  <circle cx="512" cy="822" r="70" fill="#ffffff"/>
  <circle cx="244" cy="667" r="70" fill="#ffffff"/>
  <circle cx="244" cy="357" r="70" fill="#ffffff"/>
</svg>
